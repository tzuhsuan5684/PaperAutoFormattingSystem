<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IEEE LaTeX 排版助手</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="logo">📄</div>
    <div class="title-area">
      <h1>IEEE 排版助手</h1>
      <span id="status-badge" class="badge badge-checking">檢查中...</span>
    </div>
    <label class="toggle-switch" title="啟用/停用">
      <input type="checkbox" id="enabled-toggle" />
      <span class="slider"></span>
    </label>
  </header>

  <section class="format-section">
    <h2>格式化文字</h2>
    <textarea id="input-text" placeholder="貼上論文段落或大綱...&#10;&#10;例如：&#10;Introduction&#10;Deep learning has revolutionized..." rows="6"></textarea>
    <button id="format-btn" class="btn-primary">✨ 生成 IEEE LaTeX</button>
    <div id="format-status" class="status-msg"></div>
  </section>

  <section class="output-section" id="output-section" style="display:none">
    <h2>LaTeX 輸出</h2>
    <pre id="latex-output"></pre>
    <button id="copy-btn" class="btn-secondary">📋 複製 LaTeX</button>
  </section>

  <section class="settings-section">
    <h2>設定</h2>
    <div class="field">
      <label for="api-url">API 位址</label>
      <input type="text" id="api-url" placeholder="http://localhost:8000" />
    </div>
    <div class="field">
      <label for="trigger-delay">觸發延遲（ms）</label>
      <input type="range" id="trigger-delay" min="200" max="2000" step="100" />
      <span id="trigger-delay-value">500ms</span>
    </div>
    <button id="save-btn" class="btn-secondary">儲存設定</button>
    <button id="test-btn" class="btn-outline">測試連線</button>
    <div id="settings-status" class="status-msg"></div>
  </section>

  <footer>
    <a href="https://github.com" target="_blank">GitHub</a> ·
    <span>v1.0.0</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
