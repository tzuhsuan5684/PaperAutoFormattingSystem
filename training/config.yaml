# ── 模型設定 ──────────────────────────────────────────────
model:
  base: "Qwen/Qwen2.5-1.5B-Instruct"   # 或 Qwen/Qwen2.5-3B-Instruct
  max_seq_length: 2048
  load_in_4bit: true                    # QLoRA 4-bit 量化

# ── LoRA 設定 ─────────────────────────────────────────────
lora:
  r: 16                   # LoRA rank
  lora_alpha: 32
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

# ── 訓練超參數 ────────────────────────────────────────────
training:
  output_dir: "./models/ieee-qwen2.5-1.5b-lora"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8      # 等效 batch_size = 16
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  optim: "adamw_8bit"
  fp16: false
  bf16: true                          # A100/H100 用 bf16；其他用 fp16
  max_grad_norm: 0.3
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 3
  eval_strategy: "steps"
  load_best_model_at_end: true
  report_to: "wandb"                  # 或 "none"
  seed: 42

# ── 資料設定 ──────────────────────────────────────────────
data:
  train_file: "./data/clean_pairs.jsonl"
  val_split: 0.05                     # 5% 作為驗證集
  max_train_samples: null             # null = 全部
  prompt_template: "alpaca"           # alpaca / chatml
